<script>
let currentRole = 'customer';

// Fungsi Switch Kategori (Pelanggan / Admin)
function setRole(role) {
  currentRole = role;
  const btnCustomer = document.getElementById('btn-customer');
  const btnAdmin = document.getElementById('btn-admin');
  const subTitle = document.getElementById('sub-title');
  const labelIdentity = document.getElementById('label-identity');
  const inputIdentity = document.getElementById('identity');
  const inputPassword = document.getElementById('password');
  const btnText = document.getElementById('btn-text');
  const signupPrompt = document.getElementById('signup-prompt');

  if (role === 'admin') {
    btnAdmin.classList.add('active');
    btnCustomer.classList.remove('active');
    subTitle.textContent = 'Portal Manajemen Admin NexaStore';
    labelIdentity.textContent = 'ID Admin / Email Staf';
    
    // Mengisi otomatis input email & password
    inputIdentity.value = 'admin@nexastore.com'; 
    inputPassword.value = 'admin123';
    
    btnText.textContent = 'Masuk ke Dashboard Admin';
    if (signupPrompt) signupPrompt.style.display = 'none';
  } else {
    btnCustomer.classList.add('active');
    btnAdmin.classList.remove('active');
    subTitle.textContent = 'Masuk ke akun Pelanggan Anda';
    labelIdentity.textContent = 'Alamat Email / No. HP';
    
    // Mengisi otomatis input email & password pelanggan
    inputIdentity.value = 'pelanggan123@gmail.com';
    inputPassword.value = 'pelanggan123';
    
    btnText.textContent = 'Masuk Sebagai Pelanggan';
    if (signupPrompt) signupPrompt.style.display = 'block';
  }
}

// Menyesuaikan role otomatis berdasarkan parameter URL
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const roleParam = urlParams.get('role');
  if (roleParam === 'admin') {
    setRole('admin');
  } else {
    setRole('customer');
  }
});

// Proses perpindahan halaman saat tombol login diklik
function handleLogin(e) {
  e.preventDefault();
  const identity = document.getElementById('identity').value.trim();
  const password = document.getElementById('password').value.trim();

  if (currentRole === 'admin') {
    if (identity === 'admin@nexastore.com' && password === 'admin123') {
      alert('Login Admin Berhasil! Mengalihkan ke Dashboard Admin...');
      window.location.href = 'admin.html';
    } else {
      alert('Email atau Password Admin salah!');
    }
  } else {
    if (identity === 'pelanggan123@gmail.com' && password === 'pelanggan123') {
      alert('Login Pelanggan Berhasil! Mengalihkan ke Toko...');
      window.location.href = 'index.html';
    } else {
      alert('Email atau Password Pelanggan salah!');
    }
  }
}
</script>
