<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - NexaStore</title>
<style>
:root {
  --primary: #6366f1;
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #ec4899;
  --border: rgba(255,255,255,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--bg-main); color: var(--text-main); padding: 30px; }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.header h1 { font-size: 24px; color: var(--primary); }
.btn-logout { background: #ef4444; color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; }

.grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 30px; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.card h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; }

.btn-submit { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }

table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
th { background: rgba(0,0,0,0.3); color: var(--text-muted); }

.reports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
.report-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); }
.report-box h3 { font-size: 13px; color: var(--text-muted); }
.report-box p { font-size: 20px; font-weight: bold; margin-top: 5px; color: #10b981; }
</style>
</head>
<body>

<div class="header">
  <h1>Dashboard Admin NexaStore</h1>
  <a href="login.html" class="btn-logout">Logout</a>
</div>

<div class="grid">
  <!-- Dashboard Input Barang -->
  <div class="card">
    <h2>Input Barang Baru</h2>
    <form id="form-barang" onsubmit="tambahBarang(event)">
      <div class="form-group">
        <label>Nama Barang</label>
        <input type="text" id="nama" required placeholder="Nexa Watch">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="kategori">
          <option value="Gadget">Gadget</option>
          <option value="Laptop">Laptop</option>
          <option value="Aksesori">Aksesori</option>
        </select>
      </div>
      <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" id="harga" required placeholder="1500000">
      </div>
      <div class="form-group">
        <label>Stok</label>
        <input type="number" id="stok" required placeholder="10">
      </div>
      <button type="submit" class="btn-submit">Simpan Barang</button>
    </form>
  </div>

  <!-- View Barang -->
  <div class="card">
    <h2>Daftar Barang (View)</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Nama Barang</th>
            <th>Kategori</th>
            <th>Harga</th>
            <th>Stok</th>
          </tr>
        </thead>
        <tbody id="tabel-barang">
          <tr>
            <td>Laptop Gaming Nexa Pro</td>
            <td>Laptop</td>
            <td>Rp 12.500.000</td>
            <td>10 pcs</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Laporan Harian, Bulanan, dan Tahunan -->
<div class="card">
  <h2>Laporan Penjualan & Keuangan</h2>
  <div class="reports-grid">
    <div class="report-box">
      <h3>Laporan Harian</h3>
      <p>Rp 3.250.000</p>
    </div>
    <div class="report-box">
      <h3>Laporan Bulanan</h3>
      <p>Rp 85.000.000</p>
    </div>
    <div class="report-box">
      <h3>Laporan Tahunan</h3>
      <p>Rp 980.000.000</p>
    </div>
  </div>
</div>

<script>
function tambahBarang(e) {
  e.preventDefault();
  const nama = document.getElementById('nama').value;
  const kategori = document.getElementById('kategori').value;
  const harga = parseInt(document.getElementById('harga').value).toLocaleString('id-ID');
  const stok = document.getElementById('stok').value;

  const tbody = document.getElementById('tabel-barang');
  const row = `<tr><td><strong>${nama}</strong></td><td>${kategori}</td><td>Rp ${harga}</td><td>${stok} pcs</td></tr>`;
  tbody.innerHTML += row;

  document.getElementById('form-barang').reset();
}
</script>
</body>
</html>
