<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaStore | E-Commerce Next-Gen</title>
<style>
:root {
  --primary: #6366f1;
  --bg-main: #0f172a;
  --bg-card: rgba(30, 41, 59, 0.7);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #ec4899;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

/* Header Navigasi */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}
.brand { font-size: 20px; font-weight: 800; color: var(--primary); cursor: pointer; }

.main-nav { display: flex; gap: 12px; list-style: none; }
.nav-link { 
  color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; 
  cursor: pointer; padding: 4px 0; display: inline-block;
}
.nav-link.active { color: #fff; border-bottom: 2px solid var(--primary); }

.search-bar { flex: 1; min-width: 140px; max-width: 250px; display: flex; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
.search-bar input { width: 100%; padding: 6px 10px; background: transparent; border: none; color: white; outline: none; font-size: 13px; }
.search-bar button { padding: 6px 12px; background: var(--primary); border: none; color: white; cursor: pointer; font-size: 12px; font-weight: 600; }

.nav-actions { display: flex; gap: 8px; }
.btn-action { padding: 6px 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 12px; }
.btn-login { background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); }
.btn-cart { background: var(--primary); color: white; }

/* Section Management */
.page-section { display: none; }
.page-section.active { display: block; }

.hero-banner {
  margin: 16px 5%; padding: 24px 16px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(236,72,153,0.25));
  border: 1px solid rgba(255,255,255,0.1);
}
.hero-text h1 { font-size: 24px; margin-bottom: 6px; color: #fff; }
.hero-text p { color: var(--text-muted); margin-bottom: 12px; font-size: 13px; }

.section-title { padding: 12px 5% 8px; font-size: 16px; font-weight: 700; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 0 5% 32px; }

@media (min-width: 600px) {
  .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .hero-text h1 { font-size: 32px; }
}

.card {
  background: var(--bg-card); border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
}
.card img { width: 100%; height: 130px; object-fit: cover; background: #1e293b; }
.card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
.card-body h3 { font-size: 13px; margin-top: 4px; color: #fff; }
.tag { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: rgba(236,72,153,0.2); color: var(--accent); width: max-content; }
.price { font-size: 14px; font-weight: 800; color: #fff; margin: 4px 0; }
.old-price { font-size: 10px; text-decoration: line-through; color: var(--text-muted); display: block; }
.btn-buy { width: 100%; padding: 6px; border-radius: 6px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; font-size: 12px; }

/* Modals */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.cart-content { width: 100%; max-width: 360px; background: var(--bg-main); height: 100%; padding: 16px; display: flex; flex-direction: column; position: absolute; right: 0; top: 0; }
.cart-items { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--bg-card); border-radius: 6px; font-size: 12px; }

.detail-card { background: var(--bg-main); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 100%; max-width: 450px; padding: 16px; position: relative; }
.close-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; position: absolute; right: 12px; top: 8px; }

footer { margin-top: auto; padding: 12px; background: rgba(15,23,42,0.95); text-align: center; color: var(--text-muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="switchTab('home')">NEXA</div>
  <ul class="main-nav">
    <li><a href="javascript:void(0)" class="nav-link active" id="nav-home" onclick="switchTab('home')">Home</a></li>
    <li><a href="javascript:void(0)" class="nav-link" id="nav-kategori" onclick="switchTab('kategori')">Kategori</a></li>
    <li><a href="javascript:void(0)" class="nav-link" id="nav-promo" onclick="switchTab('promo')">Promo</a></li>
  </ul>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Cari..." onkeyup="handleSearch()">
    <button onclick="handleSearch()">Cari</button>
  </div>
  <div class="nav-actions">
    <button class="btn-action btn-cart" onclick="toggleCart()">Keranjang (<span id="cart-count">0</span>)</button>
  </div>
</header>

<main>
  <!-- TAB HOME -->
  <div id="home" class="page-section active">
    <section class="hero-banner">
      <div class="hero-text">
        <h1>Koleksi Masa Depan</h1>
        <p>Diskon hingga 50% untuk audio dan gadget pilihan.</p>
        <button class="btn-action btn-cart" onclick="switchTab('promo')">Jelajahi Promo</button>
      </div>
    </section>

    <div class="section-title">⚡ Barang Pilihan</div>
    <section class="product-grid" id="grid-home"></section>
  </div>

  <!-- TAB KATEGORI -->
  <div id="kategori" class="page-section">
    <div class="section-title">📦 Semua Kategori</div>
    <section class="product-grid" id="grid-kategori"></section>
  </div>

  <!-- TAB PROMO -->
  <div id="promo" class="page-section">
    <div class="section-title">🔥 Diskon Spesial</div>
    <section class="product-grid" id="grid-promo"></section>
  </div>

  <!-- TAB SEARCH -->
  <div id="search-results" class="page-section">
    <div class="section-title" id="search-title">🔍 Hasil Pencarian</div>
    <section class="product-grid" id="grid-search"></section>
  </div>
</main>

<!-- Modal Detail -->
<div id="detailModal" class="modal-overlay" onclick="if(event.target.id==='detailModal') closeDetailModal()">
  <div class="detail-card">
    <button class="close-btn" onclick="closeDetailModal()">&times;</button>
    <img id="detail-img" style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:10px;" src="" alt="">
    <span id="detail-tag" class="tag">TAG</span>
    <h2 id="detail-title" style="margin-top:4px; font-size:16px; color:#fff;"></h2>
    <div id="detail-price" class="price"></div>
    <p id="detail-desc" style="color:var(--text-muted); font-size:12px; margin:8px 0;"></p>
    <button id="detail-add-btn" class="btn-buy">+ Keranjang</button>
  </div>
</div>

<!-- Modal Keranjang -->
<div id="cartModal" class="modal-overlay" onclick="if(event.target.id==='cartModal') toggleCart(false)">
  <div class="cart-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3>Keranjang Belanja</h3>
      <button class="close-btn" style="position:static;" onclick="toggleCart(false)">&times;</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div style="margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1);">
      <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:10px;">
        <span>Total:</span>
        <span id="cart-total">Rp 0</span>
      </div>
      <button class="btn-buy" style="background:var(--accent);" onclick="alert('Pesanan Diproses!')">Checkout</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 NexaStore Platform.</p>
</footer>

<script>
const products = [
  { id: 1, title: 'Studio ANC Wireless', category: 'home', tag: 'Audio', price: 1450000, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400', desc: 'Headphone wireless dengan Noise Cancelling.' },
  { id: 2, title: 'NexaWatch Series X', category: 'home', tag: 'Gadget', price: 2199000, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400', desc: 'Smartwatch pemantau kesehatan otomatis.' },
  { id: 3, title: 'Runner Pro V2', category: 'home', tag: 'Sepatu', price: 899000, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400', desc: 'Sepatu lari ringan dan nyaman.' },
  { id: 4, title: 'Retro Cam 35mm', category: 'home', tag: 'Kamera', price: 3100000, img: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400', desc: 'Kamera analog klasik 35mm.' },
  { id: 5, title: 'NexaBook Laptop', category: 'kategori', tag: 'Laptop', price: 12499000, img: 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=400', desc: 'Laptop ultrabook kencang.' },
  { id: 6, title: 'Gaming Headset', category: 'kategori', tag: 'Gaming', price: 950000, img: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=400', desc: 'Headset gaming 7.1 surround.' },
  { id: 7, title: 'NexaWatch Sport', category: 'promo', tag: 'Diskon 30%', price: 1199000, oldPrice: 1699000, img: 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400', desc: 'Jam tangan olahraga GPS.' },
  { id: 8, title: 'MechKey RGB Wireless', category: 'promo', tag: 'Diskon 40%', price: 750000, oldPrice: 1250000, img: 'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=400', desc: 'Keyboard mekanikal RGB.' }
];

let cart = [];

function createCardHtml(p) {
  return `
    <div class="card" onclick="openDetailModal(${p.id})">
      <img src="${p.img}" alt="Produk" onerror="this.src='https://via.placeholder.com/300x200?text=NexaStore'">
      <div class="card-body">
        <div>
          <span class="tag">${p.tag}</span>
          <h3>${p.title}</h3>
          <div class="price">
            Rp ${p.price.toLocaleString('id-ID')}
            ${p.oldPrice ? `<span class="old-price">Rp ${p.oldPrice.toLocaleString('id-ID')}</span>` : ''}
          </div>
        </div>
        <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})">+ Keranjang</button>
      </div>
    </div>
  `;
}

function renderProducts() {
  const homeGrid = document.getElementById('grid-home');
  const kategoriGrid = document.getElementById('grid-kategori');
  const promoGrid = document.getElementById('grid-promo');

  if (homeGrid) homeGrid.innerHTML = '';
  if (kategoriGrid) kategoriGrid.innerHTML = '';
  if (promoGrid) promoGrid.innerHTML = '';

  products.forEach(p => {
    const html = createCardHtml(p);
    if (p.category === 'home' && homeGrid) homeGrid.innerHTML += html;
    if (p.category === 'kategori' && kategoriGrid) kategoriGrid.innerHTML += html;
    if (p.category === 'promo' && promoGrid) promoGrid.innerHTML += html;
  });
}

function switchTab(tabId) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

  const target = document.getElementById(tabId);
  if (target) target.classList.add('active');

  const navItem = document.getElementById('nav-' + tabId);
  if (navItem) navItem.classList.add('active');
}

function handleSearch() {
  const keyword = document.getElementById('search-input').value.toLowerCase().trim();
  const searchGrid = document.getElementById('grid-search');
  
  if (!keyword) {
    switchTab('home');
    return;
  }

  const results = products.filter(p => p.title.toLowerCase().includes(keyword) || p.tag.toLowerCase().includes(keyword));
  document.getElementById('search-title').textContent = `🔍 Hasil: "${keyword}"`;
  
  if (searchGrid) {
    searchGrid.innerHTML = results.length ? results.map(p => createCardHtml(p)).join('') : '<p style="color:var(--text-muted)">Tidak ditemukan.</p>';
  }
  switchTab('search-results');
}

function openDetailModal(id) {
  const p = products.find(item => item.id === id);
  if (!p) return;

  document.getElementById('detail-img').src = p.img;
  document.getElementById('detail-tag').textContent = p.tag;
  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-price').textContent = 'Rp ' + p.price.toLocaleString('id-ID');
  document.getElementById('detail-desc').textContent = p.desc;
  document.getElementById('detail-add-btn').onclick = () => { addToCart(p.id); closeDetailModal(); };

  document.getElementById('detailModal').style.display = 'flex';
}

function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty += 1;
  else cart.push({ ...products.find(p => p.id === id), qty: 1 });
  updateCartUI();
  toggleCart(true);
}

function updateCartUI() {
  document.getElementById('cart-count').textContent = cart.reduce((acc, i) => acc + i.qty, 0);
  document.getElementById('cart-total').textContent = 'Rp ' + cart.reduce((acc, i) => acc + (i.price * i.qty), 0).toLocaleString('id-ID');
  
  const container = document.getElementById('cart-items');
  if (container) {
    container.innerHTML = cart.length ? cart.map(i => `
      <div class="cart-item">
        <div><b>${i.title}</b> (x${i.qty})</div>
        <div>Rp ${(i.price * i.qty).toLocaleString('id-ID')}</div>
      </div>
    `).join('') : '<p style="color:var(--text-muted)">Kosong.</p>';
  }
}

function toggleCart(open) {
  const modal = document.getElementById('cartModal');
  if (modal) modal.style.display = open === undefined ? (modal.style.display === 'flex' ? 'none' : 'flex') : (open ? 'flex' : 'none');
}

// Render saat dokumen dimuat penuh
window.addEventListener('DOMContentLoaded', () => {
  renderProducts();
});
</script>

</body>
</html>
