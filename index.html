<script>
// Data Produk (Ditambah lebih banyak pilihan barang)
const products = [
  // --- KATEGORI HOME (Barang Pilihan) ---
  { id: 1, title: 'Studio ANC Wireless', category: 'home', tag: 'Audio', price: 1450000, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300', desc: 'Headphone Active Noise Cancelling.' },
  { id: 2, title: 'NexaWatch Series X', category: 'home', tag: 'Gadget', price: 2199000, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300', desc: 'Smartwatch futuristik pemantau kesehatan.' },
  { id: 3, title: 'Runner Pro V2', category: 'home', tag: 'Sepatu', price: 899000, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300', desc: 'Sepatu lari ultralight empuk.' },
  { id: 4, title: 'Retro Cam 35mm', category: 'home', tag: 'Kamera', price: 3100000, img: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300', desc: 'Kamera analog bergaya klasik.' },
  { id: 5, title: 'Minimalist Tumbler 1L', category: 'home', tag: 'Aksesori', price: 185000, img: 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=300', desc: 'Tumbler tahan dingin 24 jam.' },
  { id: 6, title: 'Smart Desk Lamp RGB', category: 'home', tag: 'Elektronik', price: 349000, img: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=300', desc: 'Lampu meja pintar kontrol aplikasi.' },

  // --- KATEGORI (Semua Kategori Produk) ---
  { id: 7, title: 'NexaBook Pro 14"', category: 'kategori', tag: 'Laptop', price: 12499000, img: 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=300', desc: 'Ultrabook tipis kencang.' },
  { id: 8, title: 'Pulse Gaming Headset', category: 'kategori', tag: 'Gaming', price: 950000, img: 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300', desc: 'Audio surround 7.1 presisi.' },
  { id: 9, title: 'Mechanical Keyboard RGB', category: 'kategori', tag: 'Aksesori', price: 680000, img: 'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=300', desc: 'Keyboard mekanikal hotswap.' },
  { id: 10, title: 'Ergonomic Chair Pro', category: 'kategori', tag: 'Mebel', price: 2450000, img: 'https://images.unsplash.com/photo-1580481072645-022f9a6d1203?w=300', desc: 'Kursi kerja ergonomis penopang pinggang.' },
  { id: 11, title: 'Wireless Ergonomic Mouse', category: 'kategori', tag: 'Aksesori', price: 299000, img: 'https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=300', desc: 'Mouse nirkabel nyamannya maksimal.' },
  { id: 12, title: 'UltraWide Monitor 34"', category: 'kategori', tag: 'Elektronik', price: 5890000, img: 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=300', desc: 'Layar lengkung 144Hz untuk kerja dan game.' },

  // --- KATEGORI PROMO (Diskon Spesial) ---
  { id: 13, title: 'NexaWatch Sport', category: 'promo', tag: 'Diskon 30%', price: 1199000, img: 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300', desc: 'Jam olahraga tahan air GPS.' },
  { id: 14, title: 'True Wireless Earbuds', category: 'promo', tag: 'Diskon 40%', price: 450000, img: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300', desc: 'Earbuds TWS bass mantap.' },
  { id: 15, title: 'Powerbank FastCharge 20k', category: 'promo', tag: 'Diskon 25%', price: 275000, img: 'https://images.unsplash.com/photo-1609592424109-dd9892f1b177?w=300', desc: 'Pengisian cepat 22.5W dual port.' },
  { id: 16, title: 'Backpack Waterproof 25L', category: 'promo', tag: 'Diskon 50%', price: 249000, img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300', desc: 'Tas ransel laptop anti air.' }
];

let cart = [];

function renderProducts() {
  ['home','kategori','promo'].forEach(cat => {
    const el = document.getElementById('grid-' + cat);
    if(el) el.innerHTML = products.filter(p => p.category === cat).map(p => `
      <div class="card" onclick="openDetailModal(${p.id})">
        <img src="${p.img}" alt="${p.title}" loading="lazy">
        <div class="card-body">
          <span class="tag">${p.tag}</span>
          <h4 style="font-size:12px; margin-top:2px;">${p.title}</h4>
          <div class="price">Rp ${p.price.toLocaleString('id-ID')}</div>
          <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})">+ Keranjang</button>
        </div>
      </div>
    `).join('');
  });
}

function handleSearch() {
  const kw = document.getElementById('search-input').value.toLowerCase().trim();
  if (!kw) return switchTab('home');
  const res = products.filter(p => p.title.toLowerCase().includes(kw) || p.tag.toLowerCase().includes(kw));
  document.getElementById('search-title').textContent = `🔍 Hasil: "${kw}"`;
  document.getElementById('grid-search').innerHTML = res.length ? res.map(p => `
    <div class="card" onclick="openDetailModal(${p.id})">
      <img src="${p.img}">
      <div class="card-body">
        <span class="tag">${p.tag}</span><h4>${p.title}</h4>
        <div class="price">Rp ${p.price.toLocaleString('id-ID')}</div>
        <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})">+ Keranjang</button>
      </div>
    </div>
  `).join('') : '<p style="color:var(--text-muted); font-size:12px;">Tidak ditemukan.</p>';
  switchTab('search-results');
}

function switchTab(id) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
  document.getElementById('nav-' + id)?.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openDetailModal(id) {
  const p = products.find(x => x.id === id);
  if(!p) return;
  document.getElementById('detail-tag').textContent = p.tag;
  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-price').textContent = 'Rp ' + p.price.toLocaleString('id-ID');
  document.getElementById('detail-desc').textContent = p.desc;
  document.getElementById('detail-add-btn').onclick = () => { addToCart(p.id); closeDetailModal(); };
  document.getElementById('detailModal').style.display = 'flex';
}
function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else cart.push({ ...products.find(p => p.id === id), qty: 1 });
  updateCartUI(); toggleCart(true);
}

function updateQty(id, change) {
  const item = cart.find(i => i.id === id);
  if (item) { item.qty += change; if (item.qty <= 0) cart = cart.filter(i => i.id !== id); }
  updateCartUI();
}

function updateCartUI() {
  document.getElementById('cart-count').textContent = cart.reduce((a, b) => a + b.qty, 0);
  const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
  document.getElementById('cart-total').textContent = 'Rp ' + total.toLocaleString('id-ID');
  document.getElementById('cart-items').innerHTML = cart.length ? cart.map(i => `
    <div class="cart-item">
      <div><b>${i.title}</b><div style="color:var(--primary)">Rp ${(i.price * i.qty).toLocaleString('id-ID')}</div></div>
      <div><button class="btn-qty" onclick="updateQty(${i.id}, -1)">-</button> <span>${i.qty}</span> <button class="btn-qty" onclick="updateQty(${i.id}, 1)">+</button></div>
    </div>
  `).join('') : '<p style="color:var(--text-muted); font-size:12px;">Keranjang kosong.</p>';
}

function toggleCart(open) {
  const m = document.getElementById('cartModal');
  m.style.display = open !== undefined ? (open ? 'flex' : 'none') : (m.style.display === 'flex' ? 'none' : 'flex');
}

function goToCheckout() {
  if (!cart.length) return alert('Keranjang kosong!');
  toggleCart(false);
  const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
  document.getElementById('checkout-summary').innerHTML = cart.map(i => `<div>${i.title} (x${i.qty}) - Rp ${(i.price * i.qty).toLocaleString('id-ID')}</div>`).join('');
  document.getElementById('checkout-total').textContent = 'Rp ' + total.toLocaleString('id-ID');
  switchTab('checkout');
}

function processOrder(e) {
  e.preventDefault();
  const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
  document.getElementById('success-id').textContent = '#NX-' + Math.floor(1000 + Math.random() * 9000);
  document.getElementById('success-name').textContent = document.getElementById('cust-name').value;
  document.getElementById('success-phone').textContent = document.getElementById('cust-phone').value;
  document.getElementById('success-method').textContent = document.getElementById('payment-method').value;
  document.getElementById('success-total').textContent = 'Rp ' + total.toLocaleString('id-ID');
  document.getElementById('successModal').style.display = 'flex';
  cart = []; updateCartUI();
  document.getElementById('checkout-form').reset();
}

function closeSuccessModal() {
  document.getElementById('successModal').style.display = 'none';
  switchTab('home');
}

document.addEventListener('DOMContentLoaded', () => { renderProducts(); updateCartUI(); });
</script>
